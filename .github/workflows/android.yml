name: Android build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'pureTV.jks'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ANDROID_KEYSTORE_PATH={key}\n')
          PYTHON
          fi
      - name: Build and lint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: launcher
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug testDebugUnitTest :music:verifyReleaseSize :shortvideo:verifyReleaseSize :webtv:verifyReleaseSize
      - name: Verify package identity and existing release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python tools/verify-release-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-release-metadata
          path: launcher/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-debug
          path: launcher/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-release
          path: launcher/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: music-tv
          path: apps/music/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shortvideo-tv
          path: apps/shortvideo/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: webtv
          path: apps/webtv/build/outputs/apk/**/*.apk

  publish:
    name: Publish TV APKs
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Verify and publish signed TV applications
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path('release-artifacts')
          metadata=json.loads((root/'pureTV-release-metadata/release-metadata.json').read_text())
          assert os.environ['RELEASE_TAG']=='v'+metadata['launcher']['versionName']
          output=Path('tv-release');output.mkdir(exist_ok=True)
          sums=[]
          for key,artifact in [('launcher','pureTV-release'),('music','music-tv'),('shortvideo','shortvideo-tv'),('webtv','webtv')]:
              info=metadata[key]
              apks=[file for file in (root/artifact).rglob('*.apk') if 'release' in file.name]
              assert len(apks)==1,apks
              digest=hashlib.file_digest(apks[0].open('rb'),'sha256').hexdigest()
              assert digest==info['sha256'],f'APK checksum mismatch: {key}'
              shutil.copyfile(apks[0],output/info['releaseName'])
              sums.append(f"{digest}  {info['releaseName']}\n")
          (output/'SHA256SUMS.txt').write_text(''.join(sums))
          shutil.copyfile(root/'pureTV-release-metadata/release-metadata.json',output/'release-metadata.json')
          PYTHON
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "pureTV Launcher ${RELEASE_TAG#v}" --notes-file docs/android-release-notes.md
          fi
          gh release upload "$RELEASE_TAG" tv-release/*.apk tv-release/SHA256SUMS.txt tv-release/release-metadata.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
