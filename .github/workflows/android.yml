name: Android build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Prepare release signing
        env:
          PURETV_KEYSTORE_BASE64: ${{ secrets.PURETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PURETV_KEYSTORE_BASE64" ]; then
            python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'pureTV.jks'
          key.write_bytes(base64.b64decode(os.environ['PURETV_KEYSTORE_BASE64']))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PURETV_KEYSTORE_PATH={key}\n')
          PYTHON
          fi
      - name: Build and lint
        env:
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
        working-directory: launcher
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug testDebugUnitTest :music:verifyReleaseSize :shortvideo:verifyReleaseSize :webtv:verifyReleaseSize
      - name: Verify launcher identity and signing status
        env:
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
        run: python tools/verify-release-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-release-metadata
          path: launcher/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-debug
          path: launcher/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-release
          path: launcher/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: music-tv
          path: apps/music/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shortvideo-tv
          path: apps/shortvideo/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: webtv
          path: apps/webtv/build/outputs/apk/**/*.apk

  publish:
    name: Publish TV APKs
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import hashlib,json,shutil,os
          from pathlib import Path
          root=Path('release-artifacts')
          metadata=json.loads((root/'pureTV-release-metadata/release-metadata.json').read_text())
          info=metadata['launcher']
          assert os.environ['RELEASE_TAG']=='v'+info['versionName']
          assert info['sourceSha']==os.environ['GITHUB_SHA']
          apks=list((root/'pureTV-release').rglob('*.apk'));assert len(apks)==1
          assert hashlib.file_digest(apks[0].open('rb'),'sha256').hexdigest()==info['sha256']
          output=Path('release-staging');output.mkdir()
          shutil.copyfile(apks[0],output/info['releaseName'])
          shutil.copyfile(root/'pureTV-release-metadata/release-metadata.json',output/'release-metadata.json')
          (output/'SHA256SUMS.txt').write_text(f"{info['sha256']}  {info['releaseName']}\n")
          PYTHON
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "pureTV Launcher ${RELEASE_TAG#v}" --notes-file docs/android-release-notes.md
          if python -c "import json;exit(not json.load(open('release-staging/release-metadata.json'))['launcher']['requiresSigning'])"; then
            git checkout -b "build-assets/android-${RELEASE_TAG}-${GITHUB_RUN_ID}"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f release-staging
            git commit -m "Stage verified unsigned launcher for release signing"
            git push origin HEAD
          else
            gh release upload "$RELEASE_TAG" release-staging/*
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi
