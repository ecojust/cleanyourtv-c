name: Android build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'pureTV.jks'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ANDROID_KEYSTORE_PATH={key}\n')
          PYTHON
          fi
      - name: Build and lint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: launcher
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug testDebugUnitTest :music:verifyReleaseSize :shortvideo:verifyReleaseSize :webtv:verifyReleaseSize
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-debug
          path: launcher/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-release
          path: launcher/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: music-tv
          path: apps/music/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shortvideo-tv
          path: apps/shortvideo/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: webtv
          path: apps/webtv/build/outputs/apk/**/*.apk
