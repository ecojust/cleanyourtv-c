[package]
name = "puretv-desktop"
version = "0.1.1"
edition = "2021"
description = "pureTV Android TV manager"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
puretv-core = { path = "../core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
